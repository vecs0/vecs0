# Genera la serpiente que recorre el gráfico de contribuciones (versiones clara y oscura)
# y la publica en la rama `output`, así los commits automáticos no tocan `main`.
name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fijado al commit exacto de Platane/snk v3.5.0.
      - name: Generar SVG
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#0F766E&color_dots=#E2E8F0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#2D3343,#1E3A8A,#2563EB,#60A5FA,#BFDBFE

      # Sin acciones de terceros con permiso de escritura: un commit huérfano reemplaza `output`.
      - name: Publicar en la rama output
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: actualizar serpiente de contribuciones"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
