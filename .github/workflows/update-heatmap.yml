# Regenera el mapa de contribuciones animado una vez por día.
# Publica el SVG en la rama `output` (no en `main`), para no sumar commits
# automáticos al gráfico de contribuciones ni a la lista de Contributors.
name: Actualizar mapa de contribuciones

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/update-heatmap.yml

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG
        run: python scripts/update_contributions.py "${{ github.repository_owner }}" dist

      # Sin acciones de terceros: un commit huérfano con dist/ reemplaza la rama output.
      - name: Publicar en la rama output
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: actualizar mapa de contribuciones"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
