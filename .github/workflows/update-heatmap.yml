# Regenera el mapa de contribuciones animado una vez por día.
# Publica el SVG en la rama `output` (no en `main`), para no sumar commits
# automáticos al gráfico de contribuciones ni a la lista de Contributors.
name: Actualizar mapa de contribuciones

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/update-heatmap.yml

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG
        run: python scripts/update_contributions.py "${{ github.repository_owner }}" dist

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore: actualizar mapa de contribuciones"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
