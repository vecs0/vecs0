<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Victor Cabrera, Full Stack y Mobile Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3B82F6" opacity=".18"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0B1220" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .a { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .bar { transform-origin: 64px 174px; transform: scaleX(0); animation: grow .6s .9s ease-out forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .type { clip-path: inset(0 100% 0 0); animation: type 1.6s 1.1s steps(29) forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      .cur { opacity: 0; animation: show 0s 1.1s forwards, blink 1s 1.1s steps(1) infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s 1.4s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .row { opacity: 0; animation: slide .5s ease-out forwards; }
      @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
      .pulse { animation: pulse 2.4s 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
      @media (prefers-reduced-motion: reduce) {
        .a, .row { animation: none; opacity: 1; } .bar { animation: none; transform: none; }
        .type { animation: none; clip-path: none; } .line { animation: none; stroke-dashoffset: 0; }
        .cur, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="16" fill="url(#fade)"/>

  <!-- Texto -->
  <text x="64" y="92" class="m a" style="animation-delay:.1s" font-size="15" fill="#60A5FA" letter-spacing="2">HOLA, SOY</text>
  <text x="62" y="150" class="f a" style="animation-delay:.35s" font-size="54" font-weight="700" fill="#F8FAFC">Victor Cabrera</text>
  <rect class="bar" x="64" y="172" width="56" height="4" rx="2" fill="#3B82F6"/>
  <text x="64" y="214" class="f type" font-size="26" font-weight="600" fill="#CBD5E1">Full Stack &amp; Mobile Developer</text>
  <rect class="cur" x="426" y="192" width="3" height="28" rx="1" fill="#3B82F6"/>
  <text x="64" y="252" class="m a" style="animation-delay:2.6s" font-size="15" fill="#64748B">Web · Apps móviles · APIs  —  Paraguay</text>

  <!-- Ventana de navegador -->
  <g transform="translate(700 58)"><g class="a" style="animation-delay:.5s">
    <rect width="330" height="200" rx="12" fill="#0F172A" stroke="#1E3A8A" stroke-width="1.5"/>
    <rect width="330" height="30" rx="12" fill="#13203B"/>
    <rect y="18" width="330" height="12" fill="#13203B"/>
    <circle cx="18" cy="15" r="5" fill="#F87171"/>
    <circle cx="36" cy="15" r="5" fill="#FBBF24"/>
    <circle cx="54" cy="15" r="5" fill="#34D399"/>
    <rect x="76" y="9" width="200" height="12" rx="6" fill="#0B1220"/>
    <rect x="20" y="48" width="70" height="136" rx="6" fill="#13203B"/>
    <rect x="30" y="62" width="50" height="6" rx="3" fill="#3B82F6"/>
    <rect x="30" y="78" width="40" height="6" rx="3" fill="#334155"/>
    <rect x="30" y="94" width="46" height="6" rx="3" fill="#334155"/>
    <rect x="30" y="110" width="36" height="6" rx="3" fill="#334155"/>
    <rect x="104" y="48" width="98" height="58" rx="6" fill="#13203B"/>
    <rect x="114" y="60" width="40" height="6" rx="3" fill="#475569"/>
    <rect x="114" y="76" width="64" height="16" rx="4" fill="#3B82F6" opacity=".85"/>
    <rect x="212" y="48" width="98" height="58" rx="6" fill="#13203B"/>
    <rect x="222" y="60" width="40" height="6" rx="3" fill="#475569"/>
    <rect x="222" y="76" width="50" height="16" rx="4" fill="#60A5FA" opacity=".6"/>
    <rect x="104" y="116" width="206" height="68" rx="6" fill="#13203B"/>
    <polyline points="116,170 146,150 176,158 206,134 236,142 266,124 298,130" class="line" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="298" cy="130" r="3.5" fill="#60A5FA"/>
  </g></g>

  <!-- Teléfono -->
  <g transform="translate(1004 92)"><g class="a" style="animation-delay:.8s">
    <rect width="118" height="190" rx="20" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <rect x="44" y="9" width="30" height="6" rx="3" fill="#1E293B"/>
    <rect x="14" y="28" width="90" height="40" rx="8" fill="#1D4ED8"/>
    <rect x="22" y="38" width="36" height="5" rx="2.5" fill="#BFDBFE"/>
    <rect x="22" y="50" width="56" height="9" rx="3" fill="#F8FAFC"/>
    <g class="row" style="animation-delay:1.60s">
      <rect x="14" y="78" width="90" height="18" rx="6" fill="#13203B"/>
      <circle cx="26" cy="87" r="4" fill="#34D399"/>
      <rect x="38" y="85" width="40" height="4" rx="2" fill="#475569"/>
    </g>
    <g class="row" style="animation-delay:1.85s">
      <rect x="14" y="102" width="90" height="18" rx="6" fill="#13203B"/>
      <circle cx="26" cy="111" r="4" fill="#F87171"/>
      <rect x="38" y="109" width="34" height="4" rx="2" fill="#475569"/>
    </g>
    <g class="row" style="animation-delay:2.10s">
      <rect x="14" y="126" width="90" height="18" rx="6" fill="#13203B"/>
      <circle cx="26" cy="135" r="4" fill="#FBBF24"/>
      <rect x="38" y="133" width="44" height="4" rx="2" fill="#475569"/>
    </g>
    <rect x="40" y="174" width="38" height="4" rx="2" fill="#334155"/>
  </g></g>
</svg>
